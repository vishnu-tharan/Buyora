name: buyora
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buyora}
      POSTGRES_USER: ${POSTGRES_USER:-buyora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
  mailpit:
    image: axllent/mailpit:v1.31.2
    user: "1000:1000"
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
  backend:
    image: buyora-backend:local
    build:
      context: ./BuyoraBackend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${POSTGRES_DB:-buyora}
      DB_USERNAME: ${POSTGRES_USER:-buyora}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      API_URL: ${API_PUBLIC_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: Lax
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      EMAIL_FROM_ADDRESS: noreply@buyora.local
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID:-}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET:-}
      PAYHERE_APP_ID: ${PAYHERE_APP_ID:-}
      PAYHERE_APP_SECRET: ${PAYHERE_APP_SECRET:-}
      PAYHERE_OPERATIONS_ENABLED: ${PAYHERE_OPERATIONS_ENABLED:-false}
      PAYHERE_SANDBOX: "true"
      PAYHERE_PAYMENT_URL: https://sandbox.payhere.lk/pay/checkout
      COD_ENABLED: "true"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    stop_grace_period: 30s
    restart: "on-failure:3"
    logging: *logging
  frontend:
    image: buyora-frontend:local
    build:
      context: ./BuyoraFrontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}/api/v1
        NEXT_PUBLIC_APP_URL: http://localhost:${FRONTEND_PORT:-3000}
        IMAGE_HOSTS: ${IMAGE_HOSTS:-}
    environment:
      INTERNAL_API_URL: http://backend:8080/api/v1
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    init: true
    stop_grace_period: 20s
    restart: "on-failure:3"
    logging: *logging
volumes:
  postgres_data:

spring:
  application:
    name: buyora-api
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  # JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # Cache
  cache:
    type: redis

  # Async
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
      thread-name-prefix: buyora-async-

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    disable-swagger-default-url: true

# Application configuration
buyora:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  api-url: ${API_URL:http://localhost:8080}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:15}
      refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}
    cookie:
      secure: ${COOKIE_SECURE:true}
      same-site: ${COOKIE_SAME_SITE:Strict}
      access-cookie-name: buyora_access
      refresh-cookie-name: buyora_refresh
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    provider: ${STORAGE_PROVIDER:minio}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket-name: ${STORAGE_BUCKET:buyora-media}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/buyora-media}
  email:
    from-name: ${EMAIL_FROM_NAME:Buyora}
    from-address: ${EMAIL_FROM_ADDRESS:noreply@buyora.lk}
  payment:
    payhere:
      merchant-id: ${PAYHERE_MERCHANT_ID:}
      merchant-secret: ${PAYHERE_MERCHANT_SECRET:}
      sandbox: ${PAYHERE_SANDBOX:true}
      payment-url: ${PAYHERE_PAYMENT_URL:https://sandbox.payhere.lk/pay/checkout}
      app-id: ${PAYHERE_APP_ID:}
      app-secret: ${PAYHERE_APP_SECRET:}
      operations-enabled: ${PAYHERE_OPERATIONS_ENABLED:false}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    cod:
      enabled: ${COD_ENABLED:true}
  pagination:
    default-page-size: 20
    max-page-size: 100
  inventory:
    low-stock-threshold-default: 10
    reservation-expiry-minutes: 30
  cart:
    guest-expiry-hours: 48
  order:
    number-prefix: ORD
    cancellation-window-hours: 24
  returns:
    window-days: ${RETURN_WINDOW_DAYS:30}
  store:
    support-email: ${SUPPORT_EMAIL:}
    whatsapp-number: ${WHATSAPP_NUMBER:}
    support-hours: ${SUPPORT_HOURS:}
    business-name: ${BUSINESS_NAME:Buyora}
    business-address: ${BUSINESS_ADDRESS:}
    delivery-min-days: ${DELIVERY_MIN_DAYS:3}
    delivery-max-days: ${DELIVERY_MAX_DAYS:5}
    free-return-shipping: ${FREE_RETURN_SHIPPING:false}
    cod-districts: ${COD_DISTRICTS:}

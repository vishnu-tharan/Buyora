spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME:buyora}
    username: ${DB_USERNAME:buyora}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 30000
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  shutdown: graceful
logging:
  level:
    root: INFO
    com.buyora.api: INFO
